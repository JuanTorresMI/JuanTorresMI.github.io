# Builds the site with GitHub Pages' own Jekyll and publishes it, on every push to main. The
# snapshot workflow also starts it (by dispatch) after it commits fresh live data. Pull requests
# and other branches are built and checked, never published, by check.yml.
name: Deploy Jekyll with GitHub Pages dependencies preinstalled

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time. A newer queued run replaces an older queued one, but a deploy that has
# started always finishes.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0            # the whole history, for lastmod.py's dates
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Date each page from git (for the sitemap)
        run: python3 scripts/lastmod.py
      - name: Build with Jekyll
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./_site
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
      # The sitemap as it is live now, before this deploy replaces it: IndexNow is sent only the
      # pages whose date this deploy moves. A failed fetch leaves it empty (indexnow.py falls back).
      - name: Keep the live sitemap
        run: curl -sf --max-time 30 https://juantorresmi.github.io/sitemap.xml -o old-sitemap.xml || touch old-sitemap.xml
      - uses: actions/upload-artifact@v4
        with:
          name: old-sitemap
          path: old-sitemap.xml
          retention-days: 1

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  # Tell Bing and the other IndexNow engines which pages changed: those whose <lastmod> differs from
  # the sitemap that was live before this deploy, so a page goes once a day at most.
  # Never fails the deploy: a missed ping just waits for the next crawl.
  indexnow:
    runs-on: ubuntu-latest
    needs: deploy
    continue-on-error: true
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: old-sitemap
      - name: Ping IndexNow
        run: sleep 30 && python3 scripts/indexnow.py --since old-sitemap.xml
