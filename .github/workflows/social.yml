# One listed card to Instagram as a Reel (scripts/post_listings.py), drawn here, parked in R2 for Instagram to fetch. Without the
# IG_USER_ID and IG_ACCESS_TOKEN secrets it only prints what it would post.
name: Post a listing

# Who starts it: the Worker, at each of the day's slots (worker/src/refresh.js). GitHub's own schedule runs hours late here.
on:
  workflow_dispatch:
    inputs:
      check:
        description: "Only sign in and print the account's name and songs"
        type: boolean
        default: false
      test:
        description: "Draw the next Reel with its song as an artifact, and publish nothing"
        type: boolean
        default: false
      backfill:
        description: "Only put what's already posted on the page"
        type: boolean
        default: false
      card:
        description: "Post this card id instead of the next one"
        type: string
        default: ""
      was:
        description: "With card: its old price, for a price-drop Reel ($100.00)"
        type: string
        default: ""

permissions:
  contents: write
  actions: write

concurrency:
  group: social
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install --quiet pillow imageio-ffmpeg
      - name: Test Reel (publishes nothing)
        if: inputs.test
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          CARD: ${{ inputs.card }}
          WAS: ${{ inputs.was }}
        run: python3 scripts/post_listings.py test reel-test "$CARD" "$WAS"
      - uses: actions/upload-artifact@v4
        if: inputs.test
        with:
          name: reel-test
          path: reel-test/
      - name: Check the sign-in
        if: inputs.check
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
        run: python3 scripts/post_listings.py check
      - name: Backfill the page
        if: inputs.backfill
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
        run: python3 scripts/post_listings.py backfill
      - name: Post
        if: ${{ !inputs.check && !inputs.test && !inputs.backfill }}
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          SOCIAL_KEY: ${{ secrets.SOCIAL_KEY }}
          CARD: ${{ inputs.card }}
          WAS: ${{ inputs.was }}
        run: python3 scripts/post_listings.py post "$CARD" "$WAS"
      - name: Commit
        id: commit
        if: ${{ !inputs.check && !inputs.test }}
        run: |
          git add _data/social_posted.json _data/social_prices.json _data/social_songs.json
          if [ -e _data/social_feed.json ]; then git add _data/social_feed.json mma-cards/reels; fi
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Record the Instagram post"
          git pull --rebase origin main
          git push origin HEAD:main
          echo "changed=true" >> "$GITHUB_OUTPUT"
      - name: Deploy
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run jekyll-gh-pages.yml --ref main
