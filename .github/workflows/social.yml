# One listed card a day to Instagram (scripts/post_listings.py). It posts what the last run drew and deployed, then
# draws any new cards' pictures, so a new card can go out the day after. Without the IG_USER_ID and IG_ACCESS_TOKEN
# secrets it only prints what it would post.
name: Post a listing

on:
  schedule:
    - cron: "17 22 * * *"           # early evening in Michigan
  workflow_dispatch:
    inputs:
      check:
        description: "Only sign in and print the account's name and songs"
        type: boolean
        default: false
      test:
        description: "Draw the next Reel with its song as an artifact, and publish nothing"
        type: boolean
        default: false

permissions:
  contents: write
  actions: write

concurrency:
  group: social
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install --quiet pillow imageio-ffmpeg
      - name: Test Reel (publishes nothing)
        if: inputs.test
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
        run: python3 scripts/post_listings.py test reel-test
      - uses: actions/upload-artifact@v4
        if: inputs.test
        with:
          name: reel-test
          path: reel-test/
      - name: Check the sign-in
        if: inputs.check
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
        run: python3 scripts/post_listings.py check
      - name: Post
        if: ${{ !inputs.check && !inputs.test }}
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
        run: python3 scripts/post_listings.py post
      - name: Draw new pictures
        if: ${{ !inputs.check && !inputs.test }}
        run: python3 scripts/post_listings.py prepare
      - name: Commit
        id: commit
        if: ${{ !inputs.check && !inputs.test }}
        run: |
          git add mma-cards/social
          if [ -e _data/social_posted.json ]; then git add _data/social_posted.json; fi
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update the listing posts"
          git pull --rebase origin main
          git push origin HEAD:main
          echo "changed=true" >> "$GITHUB_OUTPUT"
      - name: Deploy
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run jekyll-gh-pages.yml --ref main
