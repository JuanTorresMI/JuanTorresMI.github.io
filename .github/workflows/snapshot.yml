# Every three hours, copies the Worker's live data into the site (scripts/snapshot.py): /youtube/ and
# /watching/ get real numbers in their HTML for crawlers and readers without JavaScript, and the
# reefer, border, beef, pork and fed cattle boards (built from the copy alone, apart from the border's "right now"
# columns) get fresh data, any new lane, crossing or cut pages and their CSVs.
# Commits only when something changed, then starts a deploy: a push made with the workflow's
# own token doesn't trigger other workflows, but an explicit dispatch does.
name: Snapshot live pages

on:
  schedule:
    # Every three hours. GitHub delays scheduled runs, often by hours (the 09:41 run of Oct 18
    # started at 13:31, and that evening's hadn't started 25 minutes after its time), and sometimes
    # skips one, so twice a day left the pages up to a day behind. With eight a day a late or skipped
    # run costs three hours, not twelve. The job only commits when something changed. Off the hour,
    # when GitHub is least busy.
    - cron: "41 */3 * * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: snapshot
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Ask the Worker
        run: python3 scripts/snapshot.py
      - name: Commit if changed
        id: commit
        run: |
          git add _data/live
          # These only exist once there is reefer, border, beef, pork or cattle data (lane pages need 4 weeks of
          # it), and a git add of a path with nothing in it fails the job.
          for p in reefer-rates/usda-reefer-truck-rates.csv _reefer_lanes/*.md border-waits/border-truck-wait-times.csv _border_crossings/*.md _border_crossings_es/*.md beef-prices/*.csv beef-prices/latest.json _beef_cuts/*.md _beef_cuts_es/*.md pork-prices/*.csv pork-prices/latest.json _pork_cuts/*.md _pork_cuts_es/*.md _data/pork_cuts.json fed-cattle-prices/*.csv fed-cattle-prices/latest.json _cattle_regions/*.md _cattle_regions_es/*.md; do
            if [ -e "$p" ]; then git add "$p"; fi
          done
          if git diff --cached --quiet; then
            echo "Nothing changed."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Refresh the live page snapshots"
          git push origin HEAD:main
          echo "changed=true" >> "$GITHUB_OUTPUT"
      - name: Deploy
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run jekyll-gh-pages.yml --ref main
