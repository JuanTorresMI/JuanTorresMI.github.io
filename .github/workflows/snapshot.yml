# Once or twice a day, copies the Worker's live data into the site (scripts/snapshot.py): /youtube/ and
# /watching/ get real numbers in their HTML for crawlers and readers without JavaScript, and the
# reefer, border, beef, pork and fed cattle boards (built from the copy alone, apart from the border's "right now"
# columns) get fresh data, any new lane, crossing or cut pages and their CSVs.
# Commits only when something changed, then starts a deploy: a push made with the workflow's
# own token doesn't trigger other workflows, but an explicit dispatch does.
name: Snapshot live pages

# Who starts it: the Worker (worker/src/refresh.js), by dispatch: every morning at 11:47 UTC, when it
# stores a new beef or pork report (weekday afternoons), and when someone presses "Update now" on a
# data board (at most once an hour). GitHub's own schedule below is only the backup: it ran every one
# of its runs here 1.5 to 5 hours late (Oct 15-18, 2026) and can drop one, so it steps aside when a
# run already happened in the last six hours.
on:
  schedule:
    - cron: "41 13 * * *"           # backup for the Worker's 11:47 UTC morning start
    - cron: "41 23 * * 1-5"         # backup for the start when the afternoon reports come in
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: snapshot
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - name: Skip a backup run the Worker already covered
        id: skip
        if: github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          since=$(date -u -d '6 hours ago' +%Y-%m-%dT%H:%M:%SZ)
          n=$(gh run list -R "$GITHUB_REPOSITORY" --workflow snapshot.yml --status success --limit 20 --json createdAt -q "[.[] | select(.createdAt > \"$since\")] | length")
          if [ "${n:-0}" -gt 0 ]; then echo "A snapshot already ran since $since."; echo "skip=true" >> "$GITHUB_OUTPUT"; fi
      - name: Checkout
        if: steps.skip.outputs.skip != 'true'
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Ask the Worker
        if: steps.skip.outputs.skip != 'true'
        run: python3 scripts/snapshot.py
      - name: Keep the open datasets
        # data/ (scripts/datasets.py): after the boards, so a slow or blocked datamart never holds them up.
        if: steps.skip.outputs.skip != 'true'
        continue-on-error: true
        run: python3 scripts/datasets.py
      - name: Commit if changed
        id: commit
        if: steps.skip.outputs.skip != 'true'
        run: |
          git add _data/live
          # These only exist once there is reefer, border, beef, pork or cattle data (lane pages need 4 weeks of
          # it), and a git add of a path with nothing in it fails the job.
          for p in reefer-rates/usda-reefer-truck-rates.csv _reefer_lanes/*.md border-waits/*.csv _border_crossings/*.md _border_crossings_es/*.md _border_people/*.md _border_people_es/*.md beef-prices/*.csv beef-prices/latest.json _beef_cuts/*.md _beef_cuts_es/*.md pork-prices/*.csv pork-prices/latest.json _pork_cuts/*.md _pork_cuts_es/*.md _data/pork_cuts.json fed-cattle-prices/*.csv fed-cattle-prices/latest.json data _cattle_regions/*.md _cattle_regions_es/*.md worker-usage/*.csv youtube/*.csv; do
            if [ -e "$p" ]; then git add "$p"; fi
          done
          if git diff --cached --quiet; then
            echo "Nothing changed."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Refresh the live page snapshots"
          # A long run (the datasets' backfill) can finish after other pushes to main: put this commit on top.
          git pull --rebase origin main
          git push origin HEAD:main
          echo "changed=true" >> "$GITHUB_OUTPUT"
      - name: Deploy
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run jekyll-gh-pages.yml --ref main
