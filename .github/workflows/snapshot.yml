# Twice a day, copies the Worker's live data into the site (scripts/snapshot.py): /youtube/ and
# /watching/ get real numbers in their HTML for crawlers and readers without JavaScript, and the
# reefer, border and beef boards (built from the copy alone, apart from the border's "right now"
# columns) get fresh data, any new lane, crossing or cut pages and their CSVs.
# Commits only when something changed, then starts a deploy: a push made with the workflow's
# own token doesn't trigger other workflows, but an explicit dispatch does.
name: Snapshot live pages

on:
  schedule:
    # Twice a day: GitHub sometimes delays or skips a scheduled run (it skipped the first one),
    # and the job only commits when something changed, so the second run costs nothing.
    - cron: "41 9 * * *"            # 09:41 UTC, early morning in Michigan
    - cron: "41 21 * * *"           # 21:41 UTC, late afternoon in Michigan
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: snapshot
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Ask the Worker
        run: python3 scripts/snapshot.py
      - name: Commit if changed
        id: commit
        run: |
          git add _data/live
          # These only exist once there is reefer, border or beef data (lane pages need 4 weeks of
          # it), and a git add of a path with nothing in it fails the job.
          for p in reefer-rates/usda-reefer-truck-rates.csv _reefer_lanes/*.md border-waits/border-truck-wait-times.csv _border_crossings/*.md _border_crossings_es/*.md beef-prices/*.csv beef-prices/latest.json _beef_cuts/*.md; do
            if [ -e "$p" ]; then git add "$p"; fi
          done
          if git diff --cached --quiet; then
            echo "Nothing changed."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Refresh the live page snapshots"
          git push origin HEAD:main
          echo "changed=true" >> "$GITHUB_OUTPUT"
      - name: Deploy
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run jekyll-gh-pages.yml --ref main
