# Once a day, copies the Worker's live data into the site (scripts/snapshot.py), so /youtube/
# and /watching/ have real numbers in their HTML for crawlers and readers without JavaScript.
# Commits only when something changed, then starts a deploy: a push made with the workflow's
# own token doesn't trigger other workflows, but an explicit dispatch does.
name: Snapshot live pages

on:
  schedule:
    - cron: "41 9 * * *"            # 09:41 UTC, early morning in Michigan, after the Worker's hourly poll
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: snapshot
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Ask the Worker
        run: python3 scripts/snapshot.py
      - name: Commit if changed
        id: commit
        run: |
          git add _data/live
          if git diff --cached --quiet; then
            echo "Nothing changed."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Refresh the live page snapshots"
          git push origin HEAD:main
          echo "changed=true" >> "$GITHUB_OUTPUT"
      - name: Deploy
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run jekyll-gh-pages.yml --ref main
