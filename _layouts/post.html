---
layout: default
---
<article class="post">
  <a class="back" href="/blog/">← All writing</a>
  <h1>{{ page.title }}</h1>
  <p class="eyebrow">{{ page.date | date: "%B %-d, %Y" }}{% if page.tags and page.tags.size > 0 %} · {{ page.tags | join: " · " }}{% endif %}</p>
  <div class="prose">
    {{ content }}
  </div>
</article>
