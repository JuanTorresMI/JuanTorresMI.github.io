<header class="site-nav">
  <div class="frame">
    <a class="wordmark" href="/" aria-label="Juan Torres, home"><span class="full">Juan Torres</span><span class="short" aria-hidden="true">JT</span></a>
    <nav class="links" aria-label="Site">
      <a href="/projects/"{% if page.url contains '/projects' or page.project %} aria-current="page"{% endif %}>Projects</a>
      <a href="/blog/"{% if page.url contains '/blog' or page.layout == 'post' %} aria-current="page"{% endif %}>Writing</a>
      <a href="/resume/"{% if page.url contains '/resume' %} aria-current="page"{% endif %}>Résumé</a>
    </nav>
    <button class="theme-btn" type="button" id="themeBtn" aria-label="Switch to dark theme" title="Light / dark">
      <svg viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="7" fill="none" stroke="currentColor" stroke-width="1"/><path d="M8 1a7 7 0 0 1 0 14z" fill="currentColor"/></svg>
    </button>
  </div>
</header>
<script>
  (() => {
    const btn = document.getElementById("themeBtn");
    const root = document.documentElement;
    const mq = window.matchMedia("(prefers-color-scheme: dark)");
    const current = () => root.getAttribute("data-theme") || (mq.matches ? "dark" : "light");
    const describe = () => { const to = current() === "dark" ? "light" : "dark"; btn.setAttribute("aria-label", `Switch to ${to} theme`); btn.title = `Switch to ${to} theme`; };
    btn.addEventListener("click", () => {
      // No stored choice means "follow the system", so the first click flips away from it.
      const next = current() === "dark" ? "light" : "dark";
      root.setAttribute("data-theme", next);
      try { localStorage.setItem("jt-theme", next); } catch (e) {}
      describe();
    });
    mq.addEventListener("change", describe);
    describe();
  })();
</script>
