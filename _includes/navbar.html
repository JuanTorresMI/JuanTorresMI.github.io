<header class="site-nav">
  <div class="in">
    <a class="wordmark" href="/" aria-label="Juan Torres, home"><span class="mark" aria-hidden="true">JT</span><span class="name">Juan Torres</span></a>
    <nav class="links" aria-label="Site">
      <a href="/projects/"{% if page.url contains '/projects' or page.project %} aria-current="page"{% endif %}>Projects</a>
      <a href="/blog/"{% if page.url contains '/blog' or page.layout == 'post' %} aria-current="page"{% endif %}>Writing</a>
      <a href="/resume/"{% if page.url contains '/resume' %} aria-current="page"{% endif %}>Resume</a>
      <a href="/watching/"{% if page.url contains '/watching' %} aria-current="page"{% endif %}>Watching</a>
    </nav>
    <button class="theme-btn" type="button" id="themeBtn" aria-label="Switch between light and dark" title="Switch theme">
      <svg class="moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
      <svg class="sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4.2"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
    </button>
  </div>
</header>
<script>
  (() => {
    const btn = document.getElementById("themeBtn");
    const root = document.documentElement;
    const systemDark = () => window.matchMedia("(prefers-color-scheme: dark)").matches;
    btn.addEventListener("click", () => {
      // No stored choice means "follow the system", so the first click flips away from it.
      const current = root.getAttribute("data-theme") || (systemDark() ? "dark" : "light");
      const next = current === "dark" ? "light" : "dark";
      root.setAttribute("data-theme", next);
      try { localStorage.setItem("jt-theme", next); } catch (e) {}
    });
  })();
</script>
