<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="JT">
  <style>
    /* Matches the card: ink monogram on bone stock, steel hairline; inverted for dark UI. */
    .bg { fill: #eeebe3; }
    .fg { fill: #0f0f0e; }
    .rule { fill: #3d5266; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #121211; }
      .fg { fill: #f4f1ea; }
      .rule { fill: #9db0c2; }
    }
  </style>
  <rect class="bg" width="64" height="64"/>
  <text class="fg" x="32.5" y="39" text-anchor="middle"
        font-family="'Cormorant Garamond',Garamond,Georgia,'Times New Roman',serif"
        font-size="31" font-weight="500" letter-spacing="1">JT</text>
  <rect class="rule" x="24" y="51" width="16" height="1.5"/>
</svg>
