profile: >-
  I’m a Logistics Management student at Central Michigan University with a 3.70 GPA (4.00 in
  the major). I’ve worked since 2021, first on a factory line and now as a certified meat cutter
  at Meijer, and I build small projects on the side to try out what I’m learning.

experience:
  - org: Meijer
    span: 2024 – Present
    place: Mount Pleasant & Cadillac, MI
    headline: Certified Meat Cutter
    summary: Cutting, inventory and food safety in a busy meat department. I manage the department’s stock in Meijer’s inventory system and take customers’ special orders.
    roles:
      - { title: Certified Meat Cutter, place: "Mount Pleasant, MI", dates: "Aug 2025 – Present" }
      - { title: Certified Meat Cutter, place: "Cadillac, MI", dates: "May 2024 – Aug 2025" }
      - { title: Meat Cutting Apprentice, place: "Cadillac, MI", dates: "Apr 2024 – May 2024" }
    points:
      - Manage the department’s inventory in Meijer’s IMS so we don’t run short or over-order, which feeds the sales forecast and keeps waste down.
      - Run the meat saws to spec under strict safety protocols; precision cutting with no accidents and no lost time.
      - Ran daily cutting and stock rotation in Cadillac, where tight rotation kept waste low and the department ahead on corporate performance metrics.
      - Follow food-safety and sanitation rules closely; routine inspections came back with zero violations.
      - Take special orders for customers, which is a big part of why they come back.
      - Learned cut specifications, blade safety, case setup, rotation and labeling (FIFO) as an apprentice under a journeyman cutter.

  - org: FIAMM Technologies
    span: 2021 – 2023
    place: Cadillac, MI
    headline: Factory Operator
    summary: Ran production equipment and kept materials moving on a manufacturing line.
    roles:
      - { title: Factory Operator, place: "Cadillac, MI", dates: "Feb 2021 – Apr 2023" }
    points:
      - Ran production equipment and kept materials moving on the line, safely and on pace.
      - My first real look at how operations work day to day, and a big part of why I study logistics now.

