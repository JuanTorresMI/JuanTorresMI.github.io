# jjulio's page (/music/). It is deliberately separate from the rest of the site: its own
# layout (_layouts/artist.html), its own look (music/music.css) and nothing that names or links
# Juan Torres. The portfolio links to it; it never links back.
#
# New releases show up on their own: the page asks the Worker (worker/src/music.js), which reads
# Apple Music and Spotify live. This file is only the fallback, and what search engines and
# no-JavaScript visitors see, so it's worth updating now and then but nothing breaks if it lags.
#
# `about` is the about-me box, in Juan's own words; leave it empty and the box doesn't show.
#
# To add a release here, add it to the top of `releases`. Links are optional per platform
# (`spotify`, `apple`, `youtube`); the page links the first one it has, in that order, and plays
# Spotify's player, or Apple Music's when a song isn't on Spotify yet. `cover` is the art the
# platform serves (Apple: …/600x600bb.jpg; Spotify: i.scdn.co …00001e02… is 300px). `credit` is a
# feature or producer ("feat. soulcast"), shown beside the title. `everywhere` is the release's
# DistroKid HyperFollow page, which lists every store DistroKid sent it to; the newest release's
# shows as "listen anywhere". `versions` are alternate cuts
# (sped up, slowed) shown as small links under the track.
# To add a platform, add it to `platforms`: it becomes a link on the page and a sameAs in the
# structured data.
