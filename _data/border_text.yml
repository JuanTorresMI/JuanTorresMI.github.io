# Words the border crossing pages need in both languages (_layouts/border-crossing.html). The
# numbers come from _data/live/border.json; these turn a weekday or an hour index into words.
# The Spanish follows CBP's own Spanish where it has a term ("sin demora", "carriles generales",
# "horas de operación", "cruce fronterizo").
en:
  days: [Monday, Tuesday, Wednesday, Thursday, Friday, Saturday, Sunday]
  short: [Mon, Tue, Wed, Thu, Fri, Sat, Sun]
  days_plural: [Mondays, Tuesdays, Wednesdays, Thursdays, Fridays, Saturdays, Sundays]
  hours: ["12 AM", "1 AM", "2 AM", "3 AM", "4 AM", "5 AM", "6 AM", "7 AM", "8 AM", "9 AM", "10 AM", "11 AM",
          "12 PM", "1 PM", "2 PM", "3 PM", "4 PM", "5 PM", "6 PM", "7 PM", "8 PM", "9 PM", "10 PM", "11 PM"]
  levels: ["Under 10 min", "10–19 min", "20–39 min", "40–59 min", "60 min or more"]
  no_wait: No wait
  closed: Closed
  pending: Pending
  old: old reading
  live: Live from CBP, checked
  # The car and pedestrian pages (/border-waits/cars/). SENTRI is NEXUS at the Canadian crossings:
  # the pages replace the word with the port's own (`sentri` in border_people.json).
  people_levels: ["Under 10 min", "10–29 min", "30–59 min", "60–89 min", "90 min or more"]
  lanes: {car_standard: "Cars, standard lanes", car_sentri: "Cars, SENTRI", car_ready: "Cars, Ready Lane", pedestrian_standard: "Walking, standard lanes", pedestrian_ready: "Walking, Ready Lane"}
  cols: {car_standard: "Cars", car_sentri: "SENTRI", car_ready: "Ready Lane", pedestrian_standard: "Walking", pedestrian_ready: "Walking, Ready"}
  lane_only: {car_standard: "standard lanes", car_sentri: "SENTRI", car_ready: "Ready Lane", pedestrian_standard: "standard lanes", pedestrian_ready: "Ready Lane"}
es:
  days: [lunes, martes, miércoles, jueves, viernes, sábado, domingo]
  short: [lun, mar, mié, jue, vie, sáb, dom]
  days_plural: [lunes, martes, miércoles, jueves, viernes, sábados, domingos]   # "los lunes": habits read in the plural
  hours: ["0:00", "1:00", "2:00", "3:00", "4:00", "5:00", "6:00", "7:00", "8:00", "9:00", "10:00", "11:00",
          "12:00", "13:00", "14:00", "15:00", "16:00", "17:00", "18:00", "19:00", "20:00", "21:00", "22:00", "23:00"]
  levels: ["Menos de 10 min", "10–19 min", "20–39 min", "40–59 min", "60 min o más"]
  no_wait: Sin demora   # CBP's own Spanish for "no delay"
  closed: Cerrado
  pending: Pendiente
  old: lectura atrasada
  live: En vivo desde CBP, consultado el
  people_levels: ["Menos de 10 min", "10–29 min", "30–59 min", "60–89 min", "90 min o más"]
  lanes: {car_standard: "Autos, carriles generales", car_sentri: "Autos, SENTRI", car_ready: "Autos, Ready Lane", pedestrian_standard: "Peatones, carriles generales", pedestrian_ready: "Peatones, Ready Lane"}
  cols: {car_standard: "Autos", car_sentri: "SENTRI", car_ready: "Ready Lane", pedestrian_standard: "Peatones", pedestrian_ready: "Peatones, Ready"}
  lane_only: {car_standard: "carriles generales", car_sentri: "SENTRI", car_ready: "Ready Lane", pedestrian_standard: "carriles generales", pedestrian_ready: "Ready Lane"}
