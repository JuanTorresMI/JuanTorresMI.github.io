- slug: aggregate-planning
  family: Work
  title: Aggregate Planner
  url: /aggregate-planning/
  kind: Tool
  status: Live
  short: You give it a year of demand and what labor and inventory cost, and it finds the cheapest production plan, month by month.
  summary: >-
    An aggregate production planning optimizer. You enter monthly demand, the size and cost of the
    workforce, and what it costs to hold stock or keep customers waiting. It works out when to hire, when to
    lay off, how much overtime to run and how much inventory to build ahead. Level, band and chase plans are
    solved side by side, laid out the way textbook cases ask the questions, and the whole thing downloads as
    an Excel workbook in the usual Solver layout. The model is a mixed-integer program, solved exactly by
    HiGHS right in the browser, and a Study mode works through the math step by step with your own numbers.
  writeup: /blog/aggregate-planning-solver-in-the-browser/
  metric: 3 workforce policies · up to 24 months · exact MIP solved in the browser
  stack: [JavaScript, HiGHS (WebAssembly), Mixed-integer programming, Chart.js, Operations planning]
  category: BusinessApplication
  search: [aggregate planning calculator, aggregate planning example, aggregate production planning, level vs chase strategy, linear programming, mixed-integer programming, branch and bound, shadow prices, Excel Solver]
  learning:
    type: Interactive tool
    level: Undergraduate
    audience: Students of operations and supply chain management
    teaches: ["Aggregate production planning", "Level, chase and band workforce strategies", "Formulating a linear program", "Branch and bound", "Shadow prices"]
  features:
    - Aggregate production planning for up to 24 months
    - Level, chase and band workforce strategies, compared side by side
    - Hiring, layoff, overtime, inventory, backlog and subcontracting costs
    - Exact mixed-integer solution with HiGHS in the browser
    - Study mode that works through the model, branch and bound and shadow prices step by step
    - Excel workbook export with live formulas in the textbook Solver layout
    - CSV export and shareable links
  keywords: [aggregate, planner, planning, highs]

- slug: reefer-rates
  family: Work
  title: Reefer Rate Board
  url: /reefer-rates/
  guide: /reefer-rates/#how-it-works
  writeup: /blog/usda-reefer-truck-rate-board/
  kind: Data
  status: Live
  short: USDA’s weekly spot rates for refrigerated trucks, from the produce shipping districts to ten big cities, on one board with a page and a history for every lane.
  summary: >-
    Every week USDA publishes what it costs to move a truckload of produce in a refrigerated trailer, from
    shipping areas like South Texas, the Imperial Valley and the Mexico crossing at Nogales to ten big
    cities. It comes as a PDF or as raw API rows, one per commodity. A Cloudflare Worker asks USDA for any
    week with a read-only key, boils the rows down to one rate per lane and adds the weekly U.S. diesel
    price, storing nothing itself. The site rebuilds twice a day: a board for this week, a page per lane with
    its history back to April 2021, and the whole dataset as a CSV.
  metric: Weekly · 68 lanes in the latest report · CSV download · $0 to run
  stack: [JavaScript, Python, Cloudflare Workers, D1 (SQLite), USDA MyMarketNews API, EIA API, GitHub Actions]
  category: WebApplication
  search: [reefer rates, reefer truck rates, produce truck rates, USDA truck rate report, refrigerated freight rates, reefer spot rates]
  keywords: [reefer, truck rates, usda]

- slug: border-waits
  family: Work
  title: Border Wait Board
  url: /border-waits/
  guide: /border-waits/#how-it-works
  writeup: /blog/border-truck-wait-times-from-cbp/
  kind: Data
  status: Live
  short: How long trucks wait at every U.S. land port on the Mexican and Canadian borders right now, and how long they usually wait at each hour of the week.
  summary: >-
    CBP posts the commercial lanes’ wait at every land port about once an hour, but only ever the number
    right now. A Cloudflare Worker reads CBP’s public feed every half hour and keeps each reading once,
    in the port’s own local time, with closed lanes stored as unknown rather than zero so they can’t drag
    an average down. The site rebuilds from it twice a day: a board of every commercial crossing, a page
    per major crossing with a heat map of the usual wait by day and hour, Spanish pages for the Mexico
    crossings, and the averages as a CSV.
  metric: Every 30 minutes · 53 commercial ports · CSV download · $0 to run
  stack: [JavaScript, Python, Cloudflare Workers, D1 (SQLite), CBP Border Wait Times, GitHub Actions]
  category: WebApplication
  search: [border wait times, truck border wait times, commercial border crossing wait, CBP border wait times, Laredo bridge wait times, Otay Mesa commercial wait time]
  keywords: [border, wait times, cbp]

