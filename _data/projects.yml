# Every project on the site, in the order the home page, the Projects page and the project bar
# show them (the first one is the featured card on /projects/). The page itself sets
# `project: <slug>` in its front matter.
#
#   slug       the page's id; also its share picture, assets/og/<slug>.png, unless `art` names another
#   family     the page family (Work, Gamer…; see CLAUDE.md): labels the card and picks its stock
#   title, url
#   kind       the small label beside it (Simulation, Tool, Data…); `status` is kept for reference, nothing shows it
#   short      one line for the home page and the cards; `summary` is the longer one the featured card shows
#   metric     the mono line of figures under a card
#   writeup    the post about it: linked from its card and the project bar, and from the JSON-LD both ways
#   guide      a section of its own page that explains it, linked from its card when there is no write-up
#   stack      what it's built with; also its JSON-LD keywords unless `search` gives better ones
#   category   schema.org applicationCategory (default EducationalApplication)
#   features   JSON-LD featureList; learning: { type, level, audience, teaches } makes it a LearningResource
#   keywords   tag commits in the Project log (matched against the repository name and commit message)

- slug: fruit-fly-dispatcher
  family: Work
  title: Fruit Fly Dispatcher
  url: /fruit-fly-dispatcher/
  kind: Simulation
  status: Live
  short: I put a fruit fly’s brain in charge of a delivery truck and raced it against Google’s routing software for a week.
  summary: >-
    I took a fruit fly’s navigation circuit, wired neuron by neuron from the FlyWire connectome, and let it
    run a week of fresh-food deliveries against Google’s OR-Tools. Each brain gets four levels of
    information, from a fly that finds stores by smell alone up to live company data. I wanted to see what
    matters more for getting food where it needs to go: who makes the decisions, or what they know.
  writeup: /blog/fruit-fly-vs-or-tools/
  metric: 55 stores · 7 days · 4 brains × 4 levels of knowledge · 300+ simulated weeks
  stack: [Python, OR-Tools CP-SAT, FlyWire connectome, Simulation, JavaScript]
  keywords: [fly, dispatcher, flywire, flyroute]

