# Every project on the site, in the order the Projects page and the project bar show them.
# keywords tag commits in the Project log (matched against the repository name and commit message).

- slug: fruit-fly-dispatcher
  title: Fruit Fly Dispatcher
  url: /fruit-fly-dispatcher/
  kind: Simulation
  status: Live
  short: I put a fruit fly’s brain in charge of a delivery truck and raced it against Google’s routing software for a week.
  summary: >-
    I took a fruit fly’s navigation circuit, wired neuron by neuron from the FlyWire connectome, and let it
    run a week of fresh-food deliveries against Google’s OR-Tools. Each brain gets four levels of
    information, from a fly that finds stores by smell alone up to live company data. I wanted to see what
    matters more for getting food where it needs to go: who makes the decisions, or what they know.
  metric: 55 stores · 7 days · 4 brains × 4 levels of knowledge · 300+ simulated weeks
  stack: [Python, OR-Tools CP-SAT, FlyWire connectome, Simulation, JavaScript]
  keywords: [fly, dispatcher, flywire, flyroute]

- slug: craft-ledger
  title: Craft Ledger
  url: /craft-ledger.html
  kind: Tool
  status: Live
  short: A price ledger for a Minecraft server economy that works out which crafts actually make money.
  summary: >-
    A price ledger for the Minecraft server economy I trade in. You enter the prices you buy and sell at,
    and it goes through every recipe in the game to find which crafts actually make money, counting each
    ingredient at what you could have sold it for instead. It can also pull in live prices from a market
    scanner.
  metric: 2,770 craftable items · market-basis costing · scanner import
  stack: [JavaScript, Single-file web app, Opportunity cost, Local-first]
  keywords: [craft, ledger]
