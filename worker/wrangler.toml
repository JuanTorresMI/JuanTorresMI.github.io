name = "house-tv"
main = "src/index.js"
compatibility_date = "2026-09-22"

# Served from house-tv.5342543fsd.workers.dev. Preview URLs are off: every deploy would
# otherwise get its own public versioned URL, and one address for this is enough.
workers_dev = true
preview_urls = false

# The auth key is a secret, not a var: it is set with `wrangler secret put` and never
# lives in this file. See README.md.
[vars]
LIVE_WINDOW_MIN = "5"
# Most guestbook posts a day, across everyone.
GUESTBOOK_DAILY_MAX = "25"
# The Workers AI model that checks guestbook posts (see the models page if it is ever retired).
MODERATION_MODEL = "@cf/google/gemma-4-26b-a4b-it"
# Only pages from these origins may sign the guestbook or bump the counter (reads are open).
WRITE_ORIGINS = "https://juantorresmi.github.io,http://localhost:4000,http://127.0.0.1:4000"
# The channel the /youtube/ page shows: its handle ("@name") or channel id ("UC..."). The
# API key that reads it is a secret (`wrangler secret put YOUTUBE_API_KEY`), not a var.
YOUTUBE_CHANNEL = "@JuanJulio001"
# The reefer board's keys are secrets too: USDA_MMN_KEY (required, MyMarketNews) and
# EIA_API_KEY (optional; without it the diesel price uses api.data.gov's shared DEMO_KEY).
# Lock the page down to one site if you ever want to; "*" is fine for read-only data.
# ALLOW_ORIGIN = "https://juantorresmi.github.io"

# Once an hour, at 17 past (off the top of the hour, when everyone else's crons run): poll
# YouTube for the /youtube/ page and store the result in D1. At 47 past: the reefer rate
# board (src/reefer.js); the string must match REEFER_CRON in index.js. Cron triggers are free.
[triggers]
crons = ["17 * * * *", "47 * * * *"]

# The music page's counter and guestbook (created with `wrangler d1 create yokonjuan`).
# Also the YouTube page's hourly snapshots. Schema: schema.sql. A database id is not a
# secret: it is useless without the account.
[[d1_databases]]
binding = "DB"
database_name = "yokonjuan"
database_id = "10606786-e11f-44f2-9119-f99940ba5bbd"

# Workers AI, for checking guestbook posts before they're stored. Free up to 10,000
# "neurons" a day; one check is a few.
[ai]
binding = "AI"
