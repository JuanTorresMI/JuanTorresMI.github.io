title: Juan Torres
# Follows the name in the home page's <title> and in search results. Keep the two together
# under about 60 characters, or Google cuts the title off.
tagline: Logistics Management, Central Michigan University
description: Juan Torres studies Logistics Management at Central Michigan University, works at Meijer and builds projects about routing, simulation and pricing.
baseurl: ""
url: "https://juantorresmi.github.io"
lang: en
author: Juan Torres
email: Torre10j@cmich.edu
# The picture that appears when a link to the site is shared. A page can set its own with
# `image:` in its front matter; the files are drawn by scripts/og-images.js.
image: /assets/og/home.png
image_alt: "Juan Torres. Logistics Management, Central Michigan University, class of 2027."
social:
  linkedin: https://www.linkedin.com/in/juan-torres-0ab3471bb
  github: https://github.com/JuanTorresMI
  substack: https://juantorresis.substack.com

# Search engine ownership codes. Paste only the content="..." value from
# Google Search Console / Bing Webmaster Tools, then push.
google_site_verification:
bing_site_verification:
timezone: America/Detroit

theme: null
markdown: kramdown
permalink: pretty

# Posts live under the writing index: /blog/<slug>/, with no date in the address. The slug
# is the filename after the date. A post that ever had another address keeps it working
# with a stub in redirects/ (see _layouts/redirect.html).
defaults:
  - scope: { path: "", type: posts }
    values: { permalink: "/blog/:title/" }

# Cloudflare Web Analytics: cookieless page counts, no consent banner needed. Paste the token
# from the dashboard's JS snippet (Web Analytics > the site > Manage site). It is public by
# design (it sits in every page's source), so it is fine here. Blank turns analytics off.
cloudflare_analytics_token:

# The site's edge helper (worker/). It serves two things the browser cannot fetch itself:
# the house TV board at "/" and the Substack feed at "/substack". Read-only and public;
# the keys it needs are Cloudflare secrets, never here. Blank it and both features fall
# back to a polite notice rather than breaking.
worker_url: "https://house-tv.5342543fsd.workers.dev"
tv_label: The living room TV

# Anything not listed here is published. Without this the Worker source, its README and
# (the moment anyone runs npm install) a whole node_modules tree would be served as part
# of the website. The .docx is the resume's source file: it belongs in the repo, not on
# the web, where the PDF is what people should get.
#
# GitHub Pages renders every Markdown file as a page even without front matter (its build
# loads jekyll-optional-front-matter; a plain local build does not), so any .md file that is
# documentation rather than content must be listed here or it turns up at /<name>/ and in
# the sitemap. CLAUDE.md did exactly that once.
exclude:
  - worker/
  - scripts/
  - node_modules/
  - vendor/
  - "*.docx"
  - Gemfile
  - Gemfile.lock
  - .gitignore
  - README.md
  - CLAUDE.md
  - LICENSE
