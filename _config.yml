# rates, the border waits, the beef and pork prices and the music page's catalog, counter and guestbook.
# scripts/snapshot.py also reads it. The keys it needs are Cloudflare secrets, never here. Blank it and every page
# falls back to its built-in copy or a polite notice rather than breaking.
worker_url: "https://house-tv.5342543fsd.workers.dev"
# The MMA card shop page (/mma-cards/): the Card Tracker's public, read-only showcase Worker (card-tracker repo,
