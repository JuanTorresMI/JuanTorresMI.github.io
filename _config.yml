title: Juan Torres
# Follows the name in the home page's <title> and in search results. Keep the two together
# under about 60 characters, or Google cuts the title off.
tagline: Logistics Management, Central Michigan University
description: Juan Torres studies Logistics Management at Central Michigan University, works at Meijer and builds projects about routing, simulation and pricing.
baseurl: ""
url: "https://juantorresmi.github.io"
lang: en
author: Juan Torres
email: Torre10j@cmich.edu
# The picture that appears when a link to the site is shared. A page can set its own with
# `image:` in its front matter; the files are drawn by scripts/og-images.js.
image: /assets/og/home.png
image_alt: "Juan Torres. Logistics Management, Central Michigan University, class of 2027."
social:
  linkedin: https://www.linkedin.com/in/juan-torres-0ab3471bb
  github: https://github.com/JuanTorresMI
  substack: https://juantorresis.substack.com

# Search engine ownership codes. Paste only the content="..." value from
# Google Search Console / Bing Webmaster Tools, then push.
google_site_verification: 2riTrji6HgHLDgupyEonnhXA3xcnkJt3BKIvxaf_NpY
bing_site_verification:
# IndexNow (Bing and others): scripts/indexnow.py pings changed pages after each deploy. The key is
# public by design; the file named after it at the root proves the site is ours.
indexnow_key: 9897a19c7af43333047aff51c359aaa3
timezone: America/Detroit

theme: null
markdown: kramdown
permalink: pretty

# Posts live under the writing index: /blog/<slug>/, with no date in the address. The slug
# is the filename after the date. A post that ever had another address keeps it working
# with a stub in redirects/ (see _layouts/redirect.html).
defaults:
  - scope: { path: "", type: posts }
    values: { permalink: "/blog/:title/" }
  - scope: { path: "", type: reefer_lanes }
    values: { layout: reefer-lane, parent: { title: Reefer truck rates, url: /reefer-rates/, parent: { title: USDA market prices, url: /usda-market-prices/ } }, image: /assets/og/reefer-rates.png, image_alt: "Reefer truck rates, by Juan Torres. USDA's weekly produce truck rates, lane by lane." }
  # Border crossings, in English and (Mexico crossings) Spanish. translations_live makes each
  # language point at the other with hreflang; set it false in both to unpair them.
  - scope: { path: "", type: border_crossings }
    values: { layout: border-crossing, lang: en, translations_live: true, parent: { title: Border truck wait times, url: /border-waits/ }, image: /assets/og/border-waits.png, image_alt: "Border truck wait times, by Juan Torres. CBP's commercial lane waits, now and by hour." }
  - scope: { path: "", type: border_crossings_es }
    values: { layout: border-crossing, lang: es, translations_live: true, parent: { title: Tiempos de espera en la frontera, url: /es/tiempos-de-espera/ }, image: /assets/og/border-waits.png, image_alt: "Tiempos de espera para camiones en la frontera, por Juan Torres." }
  - scope: { path: "", type: border_people }
    values: { layout: border-people, lang: en, translations_live: true, parent: { title: Border wait times for cars and pedestrians, url: /border-waits/cars/ }, image: /assets/og/border-waits-cars.png, image_alt: "Border wait times for cars and pedestrians, by Juan Torres. CBP's car, SENTRI, Ready Lane and pedestrian waits, now and by hour." }
  - scope: { path: "", type: border_people_es }
    values: { layout: border-people, lang: es, translations_live: true, parent: { title: Tiempos de espera en autos y a pie, url: /es/tiempos-de-espera/autos/ }, image: /assets/og/border-waits-cars.png, image_alt: "Tiempos de espera en la frontera para autos y peatones, por Juan Torres." }
  # The USDA boards' item pages, in English and Spanish, paired with hreflang through each stub's
  # `translation` (scripts/snapshot.py writes both stubs together).
  - scope: { path: "", type: beef_cuts }
    values: { layout: beef-cut, lang: en, translations_live: true, parent: { title: Boxed beef prices, url: /beef-prices/, parent: { title: USDA market prices, url: /usda-market-prices/ } }, image: /assets/og/beef-prices.png, image_alt: "Boxed beef prices, by Juan Torres. USDA's daily boxed beef cutout and the price of every cut." }
  - scope: { path: "", type: beef_cuts_es }
    values: { layout: beef-cut, lang: es, translations_live: true, parent: { title: Precios de la carne de res, url: /es/precios-de-carne-de-res/, parent: { title: Precios del USDA, url: /es/precios-usda/ } }, image: /assets/og/beef-prices.png, image_alt: "Precios de la carne de res en caja, por Juan Torres. El cutout diario del USDA y el precio de cada corte." }
  - scope: { path: "", type: pork_cuts }
    values: { layout: pork-cut, lang: en, translations_live: true, parent: { title: Pork prices, url: /pork-prices/, parent: { title: USDA market prices, url: /usda-market-prices/ } }, image: /assets/og/pork-prices.png, image_alt: "Pork prices, by Juan Torres. USDA's daily pork cutout and the price of every cut." }
  - scope: { path: "", type: pork_cuts_es }
    values: { layout: pork-cut, lang: es, translations_live: true, parent: { title: Precios del cerdo, url: /es/precios-de-cerdo/, parent: { title: Precios del USDA, url: /es/precios-usda/ } }, image: /assets/og/pork-prices.png, image_alt: "Precios del cerdo, por Juan Torres. El valor diario de la canal de cerdo del USDA y el precio de cada corte." }
  - scope: { path: "", type: cattle_regions }
    values: { layout: cattle-region, lang: en, translations_live: true, parent: { title: Fed cattle prices, url: /fed-cattle-prices/, parent: { title: USDA market prices, url: /usda-market-prices/ } }, image: /assets/og/fed-cattle-prices.png, image_alt: "Fed cattle prices, by Juan Torres. USDA's weekly cash cattle prices, 5-area and by region." }
  - scope: { path: "", type: cattle_regions_es }
    values: { layout: cattle-region, lang: es, translations_live: true, parent: { title: Precio del ganado gordo, url: /es/precios-de-ganado-gordo/, parent: { title: Precios del USDA, url: /es/precios-usda/ } }, image: /assets/og/fed-cattle-prices.png, image_alt: "Precio del ganado gordo, por Juan Torres. Precios semanales del USDA, de 5 áreas y por región." }

# One page per reefer lane (/reefer-rates/<origin>-to-<city>/). The files in _reefer_lanes/ are
# front matter only, written by scripts/snapshot.py; the data is _data/live/reefer.json.
collections:
  reefer_lanes:
    output: true
    permalink: /reefer-rates/:name/
  # One page per major commercial border crossing (/border-waits/<slug>/), and a Spanish page for
  # each Mexico crossing. Front matter only, written by scripts/snapshot.py from
  # _data/border_crossings.json; the data is _data/live/border.json.
  border_crossings:
    output: true
    permalink: /border-waits/:name/
  border_crossings_es:
    output: true
    permalink: /es/tiempos-de-espera/:name/
  # The same for cars and pedestrians: a page per major crossing (/border-waits/cars/<slug>/) and a
  # Spanish one per Mexico crossing, from _data/border_people_crossings.json; the data is
  # _data/live/border_people.json.
  border_people:
    output: true
    permalink: /border-waits/cars/:name/
  border_people_es:
    output: true
    permalink: /es/tiempos-de-espera/autos/:name/
  # One page per beef cut, primal and ground beef item (/beef-prices/<slug>/). Front matter only,
  # written by scripts/snapshot.py; names and slugs from _data/beef_cuts.json, the data is
  # _data/live/beef.json.
  beef_cuts:
    output: true
    permalink: /beef-prices/:name/
  beef_cuts_es:
    output: true
    permalink: /es/precios-de-carne-de-res/:name/
  # The pork board's cuts and primals, and the fed cattle board's regions: the same pattern, names
  # and slugs from _data/pork_cuts.json and scripts/snapshot.py's CATTLE_REGIONS.
  pork_cuts:
    output: true
    permalink: /pork-prices/:name/
  pork_cuts_es:
    output: true
    permalink: /es/precios-de-cerdo/:name/
  cattle_regions:
    output: true
    permalink: /fed-cattle-prices/:name/
  cattle_regions_es:
    output: true
    permalink: /es/precios-de-ganado-gordo/:name/

