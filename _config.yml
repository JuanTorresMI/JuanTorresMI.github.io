# The private Card Tracker (its own repo, JuanTorresMI/card-tracker), linked from the home page's Dev tools; it sits behind Cloudflare Access.
card_tracker_url: https://ledger-q7m3.5342543fsd.workers.dev/
# The family label on /watching/.
tv_label: The living room TV

# Anything not listed here is published (Jekyll already skips dotfiles and _folders). Without
# this the Worker source, the scripts and (the moment anyone runs npm install) a node_modules
# tree would be served as part of the website. The .docx is the résumé's source file: it
# belongs in the repo, not on the web, where the PDF is what people should get.
#
# GitHub Pages renders every Markdown file as a page even without front matter (its build
# loads jekyll-optional-front-matter; a plain local build does not), so any .md file that is
# documentation rather than content must be listed here or it turns up at /<name>/ and in
# the sitemap. CLAUDE.md did exactly that once.
exclude:
  - worker/
  - scripts/
  - node_modules/
  - vendor/
  - "*.docx"
  - Gemfile
  - Gemfile.lock
  - .gitignore
  - README.md
  - CLAUDE.md
  - CHANGELOG.md
  - LICENSE
