---
layout: default
title: Writing
permalink: /blog/
description: Juan Torres writes about finance, school and work on Substack.
---
<header class="phead row">
  <p class="key label">Writing</p>
  <div class="body">
    <h1>Notes on finance, school and work</h1>
    <p class="lede">Published on Substack and collected here, newest first.</p>
    <div class="actions">
      <a class="btn primary" href="https://juantorresis.substack.com/subscribe">Subscribe</a>
      <a class="btn" href="https://juantorresis.substack.com">Substack ↗</a>
    </div>
  </div>
</header>

<section class="sec">
  <header class="sec-head"><h2>All writing</h2><span class="label" id="count"></span></header>
  <div class="entries" id="posts" aria-live="polite"></div>
  <p class="log-note" id="feedNote"></p>
</section>

<script>
(() => {
  const LOCAL = [{% for post in site.posts %}{ "title": {{ post.title | jsonify }}, "url": {{ post.url | jsonify }}, "date": {{ post.date | date_to_xmlschema | jsonify }}, "excerpt": {{ post.excerpt | strip_html | strip_newlines | truncate: 180 | jsonify }}, "source": "On this site" }{% unless forloop.last %},{% endunless %}{% endfor %}];
  // Substack's RSS has no CORS headers, so this goes through the site's own Worker rather
  // than a third-party XML-to-JSON service. See worker/src/index.js.
  const WORKER = {{ site.worker_url | default: "" | jsonify }};
  const FEED = WORKER ? WORKER.replace(/\/+$/, "") + "/substack" : null;
  const esc = (s) => String(s || "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  const clip = (s, n) => (s.length > n ? s.slice(0, n).replace(/\s+\S*$/, "") + "…" : s);
  function render(items) {
    items.sort((a, b) => (a.date < b.date ? 1 : -1));
    document.getElementById("count").textContent = items.length + (items.length === 1 ? " piece" : " pieces");
    document.getElementById("posts").innerHTML = items.map((p) => {
      const d = new Date(p.date);
      const when = isNaN(d) ? "" : d.toLocaleDateString("en-US", { month: "short", day: "numeric", year: "numeric" });
      const ext = p.source === "Substack";
      return `<a class="entry row" href="${esc(p.url)}"${ext ? ' rel="noopener"' : ""}>
        <span class="key data">${esc(when)}</span>
        <span class="body"><span class="entry-head"><span class="entry-title">${esc(p.title)}</span><span class="go label">${esc(p.source)}${ext ? " ↗" : ""}</span></span>
        ${p.excerpt ? `<span class="entry-text" style="display:block">${esc(clip(p.excerpt, 170))}</span>` : ""}</span></a>`;
    }).join("");
  }
  render(LOCAL.slice());

  const note = () => { document.getElementById("feedNote").innerHTML = `Couldn't load the Substack feed just now; everything is at <a class="link" href="https://juantorresis.substack.com">juantorresis.substack.com</a>.`; };

  if (!FEED) { note(); return; }
  fetch(FEED)
    .then((r) => r.json())
    .then((data) => {
      if (data.error || !Array.isArray(data.items)) throw new Error(data.error || "feed unavailable");
      // Anything published on Substack and mirrored here would otherwise show up twice.
      const local = new Set(LOCAL.map((p) => p.title.trim().toLowerCase()));
      const subs = data.items
        .filter((it) => !local.has(String(it.title).trim().toLowerCase()))
        .map((it) => ({ title: it.title, url: it.url, date: it.date, excerpt: it.excerpt, source: "Substack" }));
      render(LOCAL.concat(subs));
    })
    .catch(note);
})();
</script>
